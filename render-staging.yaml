services:
  - type: web
    name: battery-soc-api-staging
    runtime: image
    image:
      url: ghcr.io/onabanjomicheal/voltsense:latest
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: /app/models/lstm_model.pth
      - key: SCALER_PATH
        value: /app/models/scaler.joblib
    autoDeploy: false  # deploy is triggered explicitly by CI
