services:
  - type: web
    name: battery-soc-api-production
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: /app/models/lstm_model.pth
      - key: SCALER_PATH
        value: /app/models/scaler.joblib
    autoDeploy: false  # deploy is triggered explicitly by CI, only after manual approval
