stages:
  parse_raw:
    cmd: python -m src.data_processing.raw_parser --raw_dir data/raw --interim_dir data/interim --interim_plots_dir reports/figures/interim
    deps:
      - data/raw
      - src/data_processing/raw_parser.py
    outs:
      - data/interim
      - reports/figures/interim

  estimate_soc:
    cmd: python -m src.data_processing.soc_estimation --interim_dir data/interim --processed_dir data/processed --processed_plots_dir reports/figures/processed
    deps:
      - data/interim
      - src/data_processing/soc_estimation.py
    outs:
      - data/processed
      - reports/figures/processed

  train_seeds:
    foreach:
      lstm_random:
        model: lstm
        protocol: random
        flags: ""
      gru_random:
        model: gru
        protocol: random
        flags: ""
      cnn_random:
        model: cnn_bilstm_attention
        protocol: random
        flags: ""
      lstm_holdout:
        model: lstm
        protocol: cycle_holdout
        flags: "--train-cycles Mixed HWFET LA92 --test-cycles UDDS US06"
      gru_holdout:
        model: gru
        protocol: cycle_holdout
        flags: "--train-cycles Mixed HWFET LA92 --test-cycles UDDS US06"
      cnn_holdout:
        model: cnn_bilstm_attention
        protocol: cycle_holdout
        flags: "--train-cycles Mixed HWFET LA92 --test-cycles UDDS US06"
    do:
      cmd: python -m src.training.run_seeds --config configs/${item.model}.yaml --protocol ${item.protocol} ${item.flags}
      deps:
        - data/processed
        - src/data/dataset.py
        - src/data/validation.py
        - src/models/models.py
        - src/training/train.py
        - src/training/run_seeds.py
        - configs/${item.model}.yaml
      params:
        - configs/${item.model}.yaml:
            - model
            - training
            - optuna
      outs:
        - models/runs/${item.protocol}/${item.model}_seed42:
            persist: true
        - models/runs/${item.protocol}/${item.model}_seed43:
            persist: true
        - models/runs/${item.protocol}/${item.model}_seed44:
            persist: true