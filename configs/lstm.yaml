data:
  dir: data/processed
  split:
    random_state: 24
    strategy: random_by_file
    test_size: 0.2
    val_size: 0.1
  temperatures:
  - 25degC
  - 0degC
  - n10degC
  - 10degC
  - 40degC
  - n20degC
mlflow:
  enabled: false
  experiment_name: battery_soc
  registry:
    enabled: false
    model_name: battery_soc_lstm
  tracking_uri: null
model:
  kwargs:
    hidden_size: 64
    input_size: 4
    num_layers: 2
  name: lstm
  sequence_length: 100
  
optuna:
  enabled: false
  n_trials: 8
  epochs: 10
  patience: 3
  hidden_size_range: [32, 128]
  num_layers_range: [1, 3]
  lr_range: [0.0001, 0.005]

output:
  artifact_dir: "models/lstm"
seed: 42
training:
  balance_by_cycle_type: true
  batch_size: 128
  early_stopping_patience: 5
  epochs: 30
  lr: 0.001
